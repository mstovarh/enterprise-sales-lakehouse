x-airflow-common: &airflow-common
  build:
    context: ./airflow

  image: enterprise-sales-airflow:3.3.0

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    
    AIRFLOW__CORE__FERNET_KEY: m35-shOfqJi5F3sUNHUZtDK8KyuD2adeEE9Fd6pST2o=

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: novaretail-airflow-local-jwt-secret
    AIRFLOW__API__SECRET_KEY: novaretail-airflow-local-api-secret

    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: admin
    _AIRFLOW_WWW_USER_PASSWORD: admin123

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./spark/jobs:/opt/airflow/spark/jobs
    - ./dbt/enterprise_sales:/opt/airflow/dbt/enterprise_sales

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    airflow-db:
      condition: service_healthy


services:

  postgres:
    image: postgres:16
    container_name: esl-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: enterprise_sales

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d


  api:
    build:
      context: ./api

    container_name: esl-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin123@postgres:5432/enterprise_sales

    ports:
      - "8000:8000"

    volumes:
      - ./api/app:/app/app

    depends_on:
      - postgres


  pgadmin:
    image: dpage/pgadmin4
    container_name: esl-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@enterprise.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres


  minio:
    image: minio/minio
    container_name: esl-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  spark:
    image: enterprise-sales-spark:3.5.3
    container_name: esl-spark
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    environment:
      SPARK_NO_DAEMONIZE: "true"

    ports:
      - "8081:8080"
      - "7077:7077"

    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/data

    depends_on:
      - minio

  spark-worker:
    image: enterprise-sales-spark:3.5.3
    container_name: esl-spark-worker
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark:7077

    environment:
      SPARK_NO_DAEMONIZE: "true"

    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/data

    depends_on:
      - spark

  airflow-db:
    image: postgres:16
    container_name: esl-airflow-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-init:
    <<: *airflow-common
    container_name: esl-airflow-init
    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate
        echo "Airflow initialization completed"

    restart: "no"


  airflow-api-server:
    <<: *airflow-common
    container_name: esl-airflow-api-server
    command: api-server

    ports:
      - "8080:8080"

    restart: unless-stopped

    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common
    container_name: esl-airflow-scheduler
    command: scheduler
    restart: unless-stopped

    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started


  airflow-dag-processor:
    <<: *airflow-common
    container_name: esl-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped

    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


volumes:
  postgres_data:
  minio_data:
  airflow_db_data: