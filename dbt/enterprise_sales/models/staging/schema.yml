version: 2

models:
  - name: stg_orders
    description: "Órdenes provenientes de la capa Silver."

    columns:
      - name: order_id
        description: "Identificador de la orden."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identificador del cliente."
        data_tests:
          - not_null

      - name: store_id
        description: "Identificador de la tienda."
        data_tests:
          - not_null

      - name: order_date
        description: "Fecha y hora de la orden."
        data_tests:
          - not_null

      - name: order_status
        description: "Estado de la orden."
        data_tests:
          - not_null

      - name: payment_method
        description: "Método de pago."
        data_tests:
          - not_null