version: 2

models:

  - name: fct_sales
    description: >
      Tabla de hechos de ventas. Cada registro representa una
      línea de producto perteneciente a una orden.

    columns:

      - name: order_item_id
        description: "Identificador único de la línea de venta."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Identificador de la orden."
        data_tests:
          - not_null

      - name: product_id
        description: "Identificador del producto."
        data_tests:
          - not_null

      - name: customer_id
        description: "Identificador del cliente."
        data_tests:
          - not_null

      - name: store_id
        description: "Identificador de la tienda."
        data_tests:
          - not_null

      - name: quantity
        description: "Cantidad de unidades vendidas."
        data_tests:
          - not_null

      - name: line_total
        description: "Valor total de la línea de venta."
        data_tests:
          - not_null


  - name: sales_by_store
    description: >
      Modelo analítico agregado por tienda para consumo
      en herramientas de Business Intelligence.

    columns:

      - name: store_id
        description: "Identificador de la tienda."
        data_tests:
          - not_null
          - unique

      - name: store_name
        description: "Nombre de la tienda."
        data_tests:
          - not_null

      - name: total_orders
        description: "Cantidad total de órdenes."

      - name: total_units
        description: "Cantidad total de unidades vendidas."

      - name: total_sales
        description: "Valor total de ventas."

      - name: average_line_sales
        description: "Valor promedio de las líneas de venta."